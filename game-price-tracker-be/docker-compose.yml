services:
  postgres:
    image: postgres:18-alpine
    container_name: gpt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gpt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gpt"]
      interval: 30s
      timeout: 10s
      retries: 5
    ports:
      - "15432:5432"
    volumes:
      - gpt_db_data:/var/lib/postgresql

volumes:
  gpt_db_data:
    driver: local
