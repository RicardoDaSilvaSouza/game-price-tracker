micronaut:
  application:
    name: game-price-tracker
  server:
    port: 8080

datasources:
  default:
    url: jdbc:postgresql://localhost:15432/gpt
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
    schema-generate: NONE
    dialect: POSTGRES

flyway:
  datasources:
    default:
      enabled: true
      locations: classpath:db/migration
